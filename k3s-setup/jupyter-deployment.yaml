---
# Jupyter Notebook Deployment for EDA
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jupyter-notebook
  namespace: data-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jupyter-notebook
  template:
    metadata:
      labels:
        app: jupyter-notebook
    spec:
      containers:
      - name: jupyter
        image: jupyter/scipy-notebook:latest
        ports:
        - containerPort: 8888
          name: jupyter
        env:
        - name: JUPYTER_ENABLE_LAB
          value: "yes"
        - name: GRANT_SUDO
          value: "yes"
        volumeMounts:
        - name: notebooks-volume
          mountPath: /home/jovyan/work
        - name: data-volume
          mountPath: /home/jovyan/data
          readOnly: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /
            port: 8888
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8888
          initialDelaySeconds: 20
          periodSeconds: 5
      volumes:
      - name: notebooks-volume
        persistentVolumeClaim:
          claimName: jupyter-notebooks-pvc
      - name: data-volume
        persistentVolumeClaim:
          claimName: scraper-data-pvc

---
# PersistentVolumeClaim for Jupyter notebooks
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jupyter-notebooks-pvc
  namespace: data-lab
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path

---
# Service for Jupyter Notebook
apiVersion: v1
kind: Service
metadata:
  name: jupyter-notebook-service
  namespace: data-lab
spec:
  type: NodePort
  selector:
    app: jupyter-notebook
  ports:
  - port: 8888
    targetPort: 8888
    nodePort: 30888  # Access via http://<node-ip>:30888
    name: jupyter

---
# Ingress for Jupyter (optional - if you have an ingress controller)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jupyter-ingress
  namespace: data-lab
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
  - host: jupyter.local  # Update with your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: jupyter-notebook-service
            port:
              number: 8888
