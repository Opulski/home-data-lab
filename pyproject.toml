[project]
name = "home-data-lab"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "entsoe-py>=0.7.8",
    "matplotlib>=3.10.8",
    "meteostat>=1.7.6",
    "mlflow>=3.7.0",
    "pandas>=2.3.3",
    "scikit-learn>=1.8.0",
]

[dependency-groups]
dev = [
    "black>=24.0.0",
    "isort>=5.13.0",
    "ruff>=0.7.0",
    "pre-commit>=3.6.0",
    "pytest>=8.0.0",
    "bandit>=1.7.0",
    "notebook>=7.5.1",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (black handles this)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
